[package]
name = "computeruse"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ultrapg/computeuse"

[[bin]]
name = "capture"
path = "src/bin/capture.rs"

[[bin]]
name = "interact"
path = "src/bin/interact.rs"

[dependencies]
ashpd = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.189"
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
zbus = "5.18.0"
